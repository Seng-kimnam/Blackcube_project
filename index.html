<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        const VERCEL_ORIGIN = "https://blackcube-project.vercel.app";
        const redirectHosts = new Set(["blackcube.website", "www.blackcube.website"]);

        if (!redirectHosts.has(window.location.hostname)) return;

        window.location.replace(
          VERCEL_ORIGIN +
            window.location.pathname +
            window.location.search +
            window.location.hash,
        );
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://6a79a81351198decb7534fab.imgix.net/sandbox/logo.jpg"
    />

    <title>BlackCube</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
